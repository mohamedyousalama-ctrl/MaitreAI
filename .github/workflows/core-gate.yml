# ============================================================================
# MaitreAI — Core gate
#
# WHY THIS FILE EXISTS
# ────────────────────
# Before this workflow, a pull request that did not touch one of the nine paths
# listed in `agent-eval.yml` ran exactly TWO checks: the Playwright specs in
# `ui-stacking.yml`. No typecheck, no lint, no unit tests. That covered roughly
# a third of the tracked files — a change to the ordering page, the console, or
# lib/orders merged with no static analysis at all.
#
# This workflow has NO path filter. It runs on every pull request.
#
# It does not replace `agent-eval.yml`; that one stays as the deep agent-path
# eval. This is the floor that applies to everything.
#
# STATE OF THE THREE CHECKS (measured 2026-08-26 on main @ 14ace390)
# ──────────────────────────────────────────────────────────────────
#   npx tsc --noEmit   → exit 0. Blocking below.
#   npm run lint       → exit 0, 456 warnings. Blocking below.
#                        (It exited 1 until 2026-08-26: `.eslintrc.json` did not
#                        register the `@typescript-eslint` plugin, so the inline
#                        `eslint-disable @typescript-eslint/...` comments in 48
#                        source files each raised "Definition for rule ... was
#                        not found". The plugin was installed all along, via
#                        eslint-config-next. Adding it to `plugins` fixed it.)
#   npm run test:unit  → 112 of 114 files pass. NOT blocking yet — see below.
#
# THE TWO REMAINING FAILURES — ONE ROOT CAUSE, AND IT IS A REAL PRODUCT GAP
# ────────────────────────────────────────────────────────────────────────
# Five assertions across proof-media-proxy and proof-console-batch-a read
# app/(console-v2)/c/(app)/conversations/page.tsx and assert a full-transcript
# surface: an inbound photo thumbnail, sendFailureMessageKey on the send path,
# conversationBucket counting, and a stick-to-bottom scroll handler.
#
# PR #540 ("Build console takeover queue", af8d8fa) rebuilt that page as a
# takeover QUEUE — a 4-message view-only preview with a locked composer. None of
# those four capabilities is on it any more. They were not deleted from the
# product: sendFailureMessageKey lives in lib/console-v2/send-failure.ts,
# conversationBucket in lib/console-v2/display-state.ts, and stickToBottom /
# onScroll in the classic components/conversations/ChatWindow.tsx.
#
# The media one is different and worse. e9ae364 (WO-MEDIA-PROXY, PR #444) added
# the inbound-photo thumbnail to that page; af8d8fa removed it along with the
# PhotoThumb component. app/api/console/media/[messageId] — a session-authed,
# tenant-scoped proxy built precisely so inbound customer photos render — now has
# NO CALLER anywhere in app/ or components/. Customers send photos; no operator
# surface displays them. The i18n keys conv.media.photo / .photoOutbound are
# orphaned too. Restoring it needs a data-layer change as well: ChatMessage
# carries `metadata`, but nothing maps the row's meta.image through to it.
#
# These five are therefore NOT stale assertions and are NOT being re-pointed.
# Whether the takeover queue should regain a transcript (and photos) is a product
# decision. The tests are left FAILING on purpose, because they are reporting a
# true gap — silencing them is exactly the weakening docs/governance/
# REVIEW_AND_AUDIT.md forbids.
#
# TO MAKE THE SUITE BLOCKING: fix those seven, then delete the
# `continue-on-error: true` line from the `unit` job. That is the whole change.
#
# CORRECTION (audited 26 Aug, after this file was first written). The original
# text here claimed "the full suite runs on every pull request and its failures
# are visible on every run". That was FALSE IN EFFECT. `test:unit` was a single
# `&&` chain of 113 commands, and command #8 fails — so the chain exited there
# and 105 files never executed, in CI or locally. Nothing was marked skipped;
# the chain SHAPE quarantined 93% of the suite, and `continue-on-error` then
# swallowed the exit code. Every count taken by running it was a count of 8 files.
#
# `test:unit` is now `node scripts/run-unit-suite.mjs`, which runs every file in
# scripts/unit-suite.json regardless of failures, prints a real tally, and exits
# non-zero if any failed. The claim above is now true.
# ============================================================================

name: Core gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: core-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck + lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  unit:
    name: Unit suite — 114 files (reporting)
    runs-on: ubuntu-latest
    # Not blocking yet: 2 of 114 files fail — both reporting a REAL product gap
    # (the console-v2 conversations rebuild), not drifted assertions. See the header.
    # Delete this line once that gap is closed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit suite
        run: npm run test:unit
