# KIVO V1 — TRUSTED PM INGRESS ROUTER (transport only)
#
# Scope: Kivo V1 ONLY. This router contains no Anthropic/Linear secret-bearing step.
# It accepts a PM task only from the repository owner on issue #577, claims the immutable
# task id, then emits a repository_dispatch event for a separate least-privilege worker.

name: Kivo V1 PM Relay Router

on:
  issue_comment:
    types: [created]

concurrency:
  group: kivo-v1-router-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    # Fail closed before any write-capable step. Every condition is required.
    if: >-
      github.repository == 'mohamedyousalama-ctrl/MaitreAI' &&
      github.event.issue.number == 577 &&
      github.actor == 'mohamedyousalama-ctrl' &&
      github.event.comment.user.login == 'mohamedyousalama-ctrl' &&
      contains(github.event.issue.labels.*.name, 'kivo-v1-relay') &&
      startsWith(github.event.comment.body, 'PM-TASK KIVO-V1-RELAY-') &&
      contains(github.event.comment.body, '— PROVIDER CLAUDE-GITHUB-ACTION — STATUS RELEASED')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # required by GitHub's repository_dispatch endpoint
      issues: write   # immutable claim/dispatch markers on #577

    steps:
      - name: Validate owner-authored task envelope
        id: validate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          IFS= read -r FIRST_LINE <<< "${COMMENT_BODY}"
          if ! printf '%s\n' "${FIRST_LINE}" | grep -Eq '^PM-TASK KIVO-V1-RELAY-[0-9]{4} — ROLE (PM-SCRIBE|BUILDER|INDEPENDENT-REVIEWER|QUALITY-REVIEWER|AUDITOR) — PROVIDER CLAUDE-GITHUB-ACTION — STATUS RELEASED$'; then
            echo '::error::Invalid Kivo V1 relay task header.'
            exit 1
          fi

          TASK_ID="$(printf '%s\n' "${FIRST_LINE}" | awk '{print $2}')"
          ROLE="$(printf '%s\n' "${FIRST_LINE}" | sed -E 's/^.*— ROLE ([^ ]+) — PROVIDER.*$/\1/')"
          REF="$(printf '%s\n' "${COMMENT_BODY}" | sed -n 's/^ref: //p' | head -n 1)"
          SHA="$(printf '%s\n' "${COMMENT_BODY}" | sed -n 's/^sha: //p' | head -n 1)"

          printf '%s\n' "${COMMENT_BODY}" | grep -Fxq 'repository: mohamedyousalama-ctrl/MaitreAI' || {
            echo '::error::Repository gate failed.'; exit 1;
          }
          [ -n "${REF}" ] || { echo '::error::Missing ref.'; exit 1; }
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid sha.'; exit 1; }
          printf '%s\n' "${COMMENT_BODY}" | grep -q '^terminal-wording:' || {
            echo '::error::Missing terminal-wording contract.'; exit 1;
          }

          ALL_COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/577/comments" --jq '.[].body')"
          if printf '%s\n' "${ALL_COMMENTS}" | grep -Eq "^(CLAUDE-HANDBACK|CHATGPT-HANDBACK) ${TASK_ID} "; then
            echo '::error::Task id already has a terminal handback; consumed ids cannot be dispatched.'
            exit 1
          fi
          if printf '%s\n' "${ALL_COMMENTS}" | grep -Fq "ROUTER-CLAIM ${TASK_ID} "; then
            echo "Task ${TASK_ID} is already claimed; refusing duplicate dispatch."
            exit 0
          fi

          echo "task_id=${TASK_ID}" >> "${GITHUB_OUTPUT}"
          echo "role=${ROLE}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Claim immutable task id before dispatch
        if: steps.validate.outputs.task_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.validate.outputs.task_id }}
          ROLE: ${{ steps.validate.outputs.role }}
        run: |
          set -euo pipefail
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "ROUTER-CLAIM ${TASK_ID} — ROLE ${ROLE} — SOURCE-COMMENT ${{ github.event.comment.id }} — DISPATCH PENDING"

      - name: Emit supported isolated role dispatch
        if: steps.validate.outputs.task_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TASK_ID: ${{ steps.validate.outputs.task_id }}
          ROLE: ${{ steps.validate.outputs.role }}
          REF: ${{ steps.validate.outputs.ref }}
          SHA: ${{ steps.validate.outputs.sha }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg event_type 'kivo-v1-relay' \
            --arg task_id "${TASK_ID}" \
            --arg role "${ROLE}" \
            --arg relay_issue '577' \
            --arg ref "${REF}" \
            --arg sha "${SHA}" \
            --arg source_comment_id "${SOURCE_COMMENT_ID}" \
            --arg task_body "${COMMENT_BODY}" \
            '{event_type:$event_type,client_payload:{task_id:$task_id,role:$role,relay_issue:$relay_issue,ref:$ref,sha:$sha,source_comment_id:$source_comment_id,task_body:$task_body}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "ROUTER-DISPATCHED ${TASK_ID} — ROLE ${ROLE} — repository_dispatch/kivo-v1-relay — PM_INTAKE_NOT_REQUIRED"
