name: UI stacking guard

# Catches "covered control" / click-capture regressions (the logout-dropdown bug
# class) before they ship. Runs the app in demo mode and click-hit-tests the
# account/logout dropdown on every console page with a real browser.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stacking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run UI stacking guard
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
