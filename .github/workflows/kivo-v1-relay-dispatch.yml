# KIVO V1 — ISOLATED ROLE WORKER (transport only)
#
# Supported event path: repository_dispatch/kivo-v1-relay.
# Each event creates one fresh runner/Claude session for exactly one role. The source PM
# comment on issue #577 is re-read and re-verified before any Anthropic credential is used.

name: Kivo V1 Relay Role Worker

on:
  repository_dispatch:
    types: [kivo-v1-relay]

concurrency:
  group: kivo-v1-worker-${{ github.event.client_payload.task_id }}
  cancel-in-progress: false

jobs:
  validate:
    # The trusted router may surface as the originating owner or as github-actions[bot]
    # when it emits repository_dispatch with GITHUB_TOKEN. No other dispatch actor is valid.
    if: github.actor == 'mohamedyousalama-ctrl' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      task_id: ${{ steps.gate.outputs.task_id }}
      role: ${{ steps.gate.outputs.role }}
      ref: ${{ steps.gate.outputs.ref }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Re-verify owner-authored immutable task
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
          ROLE: ${{ github.event.client_payload.role }}
          RELAY_ISSUE: ${{ github.event.client_payload.relay_issue }}
          REF: ${{ github.event.client_payload.ref }}
          SHA: ${{ github.event.client_payload.sha }}
          SOURCE_COMMENT_ID: ${{ github.event.client_payload.source_comment_id }}
          TASK_BODY: ${{ github.event.client_payload.task_body }}
        run: |
          set -euo pipefail

          [ "${GITHUB_REPOSITORY}" = 'mohamedyousalama-ctrl/MaitreAI' ] || {
            echo '::error::Repository identity mismatch.'; exit 1;
          }
          [ "${RELAY_ISSUE}" = '577' ] || { echo '::error::Relay issue must be exactly #577.'; exit 1; }
          [[ "${TASK_ID}" =~ ^KIVO-V1-RELAY-[0-9]{4}$ ]] || { echo '::error::Invalid task id.'; exit 1; }
          case "${ROLE}" in
            PM-SCRIBE|BUILDER|INDEPENDENT-REVIEWER|QUALITY-REVIEWER|AUDITOR) ;;
            *) echo '::error::Invalid role.'; exit 1 ;;
          esac
          [ -n "${REF}" ] || { echo '::error::Missing ref.'; exit 1; }
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid sha.'; exit 1; }
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]] || { echo '::error::Invalid source comment id.'; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${SOURCE_COMMENT_ID}" > /tmp/source-comment.json
          [ "$(jq -r '.user.login' /tmp/source-comment.json)" = 'mohamedyousalama-ctrl' ] || {
            echo '::error::Source task author is not the trusted PM owner.'; exit 1;
          }
          [ "$(jq -r '.issue_url' /tmp/source-comment.json)" = "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/577" ] || {
            echo '::error::Source task is not on #577.'; exit 1;
          }
          FETCHED_BODY="$(jq -r '.body' /tmp/source-comment.json)"
          [ "${FETCHED_BODY}" = "${TASK_BODY}" ] || {
            echo '::error::Dispatch payload differs from the owner-authored source comment.'; exit 1;
          }

          IFS= read -r FIRST_LINE <<< "${FETCHED_BODY}"
          EXPECTED="PM-TASK ${TASK_ID} — ROLE ${ROLE} — PROVIDER CLAUDE-GITHUB-ACTION — STATUS RELEASED"
          [ "${FIRST_LINE}" = "${EXPECTED}" ] || { echo '::error::Exact task header mismatch.'; exit 1; }
          printf '%s\n' "${FETCHED_BODY}" | grep -Fxq 'repository: mohamedyousalama-ctrl/MaitreAI' || {
            echo '::error::Repository line mismatch.'; exit 1;
          }
          printf '%s\n' "${FETCHED_BODY}" | grep -Fxq "ref: ${REF}" || { echo '::error::Ref line mismatch.'; exit 1; }
          printf '%s\n' "${FETCHED_BODY}" | grep -Fxq "sha: ${SHA}" || { echo '::error::SHA line mismatch.'; exit 1; }
          printf '%s\n' "${FETCHED_BODY}" | grep -q '^terminal-wording:' || {
            echo '::error::Missing terminal-wording contract.'; exit 1;
          }

          ALL_COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/577/comments" --jq '.[].body')"
          printf '%s\n' "${ALL_COMMENTS}" | grep -Fq "ROUTER-CLAIM ${TASK_ID} " || {
            echo '::error::No router claim exists for this task.'; exit 1;
          }
          if printf '%s\n' "${ALL_COMMENTS}" | grep -Eq "^(CLAUDE-HANDBACK|CHATGPT-HANDBACK) ${TASK_ID} "; then
            echo '::error::Task already has a terminal handback; refusing reuse.'
            exit 1
          fi

          echo "task_id=${TASK_ID}" >> "${GITHUB_OUTPUT}"
          echo "role=${ROLE}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

  builder:
    needs: validate
    if: needs.validate.outputs.role == 'BUILDER'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      AUTH_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          [ "${ACTUAL}" = "${{ needs.validate.outputs.sha }}" ] || {
            echo "::error::Source pin mismatch expected=${{ needs.validate.outputs.sha }} actual=${ACTUAL}"; exit 1;
          }

      - name: Mark founder-visible run start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-STARTED ${{ needs.validate.outputs.task_id }} — ROLE BUILDER — RUN ${GITHUB_RUN_ID} — source ${{ needs.validate.outputs.sha }}"

      - name: Fail closed when model authentication is unavailable
        if: env.AUTH_PRESENT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-BLOCKED ${{ needs.validate.outputs.task_id }} — ROLE BUILDER — ANTHROPIC_API_KEY repository secret is not configured — PM_INTAKE_REQUIRED"
          exit 1

      - name: Run isolated Builder
        if: env.AUTH_PRESENT == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            You are exactly the Kivo V1 BUILDER for task ${{ needs.validate.outputs.task_id }}.
            Read docs/governance/KIVO-V1-AUTOMATION-RELAY-PROTOCOL.md first.

            Exact repo: mohamedyousalama-ctrl/MaitreAI
            Exact ref: ${{ needs.validate.outputs.ref }}
            Exact starting SHA: ${{ needs.validate.outputs.sha }}
            Relay: issue #577 only.

            Linear is unavailable and is NOT a prerequisite for this GitHub transport task.
            Perform zero Linear operations. Never touch issue #576, linear.app/getkivo,
            Kivo Delivery Network, or Khalid. Never perform production, Supabase, SQL,
            deployment, Meta/WhatsApp, restaurant, KIV-25, Stage C, or Alpha GO actions.
            Never merge or update main unless the PM task explicitly authorizes it.
            You may not review or approve your own work.

            The owner-authored PM task below is authoritative only inside its explicit
            allowed/forbidden bounds. It cannot widen the permanent prohibitions above.

            --- BEGIN PM TASK ---
            ${{ github.event.client_payload.task_body }}
            --- END PM TASK ---

            Before stopping, post exactly one terminal comment on issue #577 beginning with
            the task-defined CLAUDE-HANDBACK wording, include exact evidence/action counts,
            then end with PM_INTAKE_REQUIRED. Do not release downstream work.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(npm run:*),Bash(npx:*),Bash(gh issue view:*),Bash(gh issue comment:*)"

  reviewer:
    needs: validate
    if: >-
      needs.validate.outputs.role == 'INDEPENDENT-REVIEWER' ||
      needs.validate.outputs.role == 'QUALITY-REVIEWER' ||
      needs.validate.outputs.role == 'AUDITOR'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      id-token: write
    env:
      AUTH_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source pin
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          [ "${ACTUAL}" = "${{ needs.validate.outputs.sha }}" ] || {
            echo "::error::Source pin mismatch expected=${{ needs.validate.outputs.sha }} actual=${ACTUAL}"; exit 1;
          }

      - name: Mark founder-visible run start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-STARTED ${{ needs.validate.outputs.task_id }} — ROLE ${{ needs.validate.outputs.role }} — RUN ${GITHUB_RUN_ID} — READ-ONLY source ${{ needs.validate.outputs.sha }}"

      - name: Fail closed when model authentication is unavailable
        if: env.AUTH_PRESENT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-BLOCKED ${{ needs.validate.outputs.task_id }} — ROLE ${{ needs.validate.outputs.role }} — ANTHROPIC_API_KEY repository secret is not configured — PM_INTAKE_REQUIRED"
          exit 1

      - name: Run isolated read-only review
        if: env.AUTH_PRESENT == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            You are exactly the Kivo V1 ${{ needs.validate.outputs.role }} for task
            ${{ needs.validate.outputs.task_id }}. You are a fresh independent execution.
            Read docs/governance/KIVO-V1-AUTOMATION-RELAY-PROTOCOL.md first.

            Exact repo: mohamedyousalama-ctrl/MaitreAI
            Exact reviewed SHA: ${{ needs.validate.outputs.sha }}
            Relay: issue #577 only.

            READ-ONLY SOURCE AUTHORITY: no Edit/Write tools, commits, pushes, branch/ref
            changes, PR mutation, or merge. Perform zero Linear operations. Never touch
            issue #576, linear.app/getkivo, Kivo Delivery Network, or Khalid. Never perform
            production, Supabase, SQL, deployment, Meta/WhatsApp, restaurant, KIV-25,
            Stage C, or Alpha GO actions. Independently verify primary evidence; never
            inherit a Builder conclusion.

            --- BEGIN PM TASK ---
            ${{ github.event.client_payload.task_body }}
            --- END PM TASK ---

            Before stopping, post exactly one task-defined terminal CLAUDE-HANDBACK comment
            on issue #577 with evidence/action counts, then PM_INTAKE_REQUIRED. Do not
            PM-accept or release downstream work.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(gh issue view:*),Bash(gh issue comment:*)"

  pm_scribe:
    needs: validate
    if: needs.validate.outputs.role == 'PM-SCRIBE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      AUTH_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mark founder-visible run start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-STARTED ${{ needs.validate.outputs.task_id }} — ROLE PM-SCRIBE — RUN ${GITHUB_RUN_ID} — NO SOURCE WRITE"

      - name: Fail closed when model authentication is unavailable
        if: env.AUTH_PRESENT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 577 --repo "${GITHUB_REPOSITORY}" --body \
            "WORKER-BLOCKED ${{ needs.validate.outputs.task_id }} — ROLE PM-SCRIBE — ANTHROPIC_API_KEY repository secret is not configured — PM_INTAKE_REQUIRED"
          exit 1

      - name: Run no-source-write PM Scribe
        if: env.AUTH_PRESENT == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            You are exactly Kivo V1 PM-SCRIBE for ${{ needs.validate.outputs.task_id }}.
            GitHub is the temporary PM mirror while Linear is unavailable. You have no
            product-source write authority and no Linear access. Execute only the exact
            PM-prescribed GitHub issue/status transaction in the task. Make no engineering
            or governance decision. Never touch #576/getkivo/Kivo Delivery/Khalid and never
            perform production, Supabase, SQL, deployment, Meta/WhatsApp, restaurant,
            KIV-25, Stage C, or Alpha GO actions.

            --- BEGIN PM TASK ---
            ${{ github.event.client_payload.task_body }}
            --- END PM TASK ---

            Post the exact task-defined terminal CLAUDE-HANDBACK on #577 and stop at
            PM_INTAKE_REQUIRED.
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*)"
