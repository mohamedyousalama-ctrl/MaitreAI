<svg width="200" height="56" viewBox="0 0 200 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kivo">
  <title>Kivo</title>
  <defs>
    <linearGradient id="kvTile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13b07a"/>
      <stop offset="1" stop-color="#0a6e4c"/>
    </linearGradient>
    <linearGradient id="kvStroke" x1="0.1" y1="0.96" x2="0.86" y2="0.04">
      <stop stop-color="#eafff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Kivo emerald app-icon tile + check-arrow mark -->
  <g transform="translate(2,4)">
    <rect width="48" height="48" rx="13" fill="url(#kvTile)"/>
    <path d="M13.4 25.4 L21.6 34 L36 15.4" fill="none" stroke="#0a5238" stroke-width="5.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 .6)"/>
    <path d="M13.4 25.4 L21.6 34 L36 15.4" fill="none" stroke="url(#kvStroke)" stroke-width="5.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Kivo wordmark (emerald ink) -->
  <text x="62" y="37" font-family="'Sora','Readex Pro',system-ui,-apple-system,sans-serif" font-weight="800" font-size="30" letter-spacing="-0.5" fill="#0a3a2a">Kivo</text>
</svg>
