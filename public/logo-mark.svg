<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kivo">
  <title>Kivo</title>
  <defs>
    <linearGradient id="maTile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13b07a"/>
      <stop offset="1" stop-color="#0a6e4c"/>
    </linearGradient>
    <linearGradient id="maStroke" x1="0.1" y1="0.96" x2="0.86" y2="0.04">
      <stop stop-color="#eafff6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile, Kivo emerald gradient -->
  <rect width="100" height="100" rx="24" fill="url(#maTile)"/>
  <!-- the Kivo check-arrow mark (under-rim + body) -->
  <path d="M28 53 L45 71 L75 31" fill="none" stroke="#0a5238" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1.2)"/>
  <path d="M28 53 L45 71 L75 31" fill="none" stroke="url(#maStroke)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
